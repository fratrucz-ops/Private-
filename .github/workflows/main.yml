name: Build Ore Lavoro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica progetto
        uses: actions/checkout@v4

      - name: Estrai progetto Android
        run: unzip -o OreLavoro-Android-ready.zip

      - name: Installa Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepara Android
        uses: android-actions/setup-android@v3

      - name: Installa SDK Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Prepara Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compila APK
        working-directory: OreLavoro-Android
        run: gradle assembleDebug

      - name: Salva APK
        uses: actions/upload-artifact@v4
        with:
          name: OreLavoro-APK
          path: OreLavoro-Android/app/build/outputs/apk/debug/app-debug.apk
